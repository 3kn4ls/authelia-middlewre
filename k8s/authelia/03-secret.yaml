apiVersion: v1
kind: Secret
metadata:
  name: authelia-secrets
  namespace: authelia
  labels:
    app: authelia
type: Opaque
stringData:
  # IMPORTANTE: Cambiar estos valores antes de desplegar
  # Puedes generar valores aleatorios con: openssl rand -hex 32

  # Secret para JWT tokens (debe ser aleatorio y seguro)
  JWT_SECRET: "CAMBIAR_ESTE_SECRET_POR_UNO_ALEATORIO_32_CHARS"

  # Secret para encriptación de sesiones (debe ser aleatorio y seguro)
  SESSION_SECRET: "CAMBIAR_ESTE_SECRET_POR_UNO_ALEATORIO_32_CHARS"

  # Secret para encriptación del storage (debe ser aleatorio y seguro)
  STORAGE_ENCRYPTION_KEY: "CAMBIAR_ESTE_SECRET_POR_UNO_ALEATORIO_32_CHARS"

  # Si usas SMTP para notificaciones, añade aquí las credenciales
  # SMTP_PASSWORD: "tu_password_smtp"
---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-users
  namespace: authelia
  labels:
    app: authelia
type: Opaque
stringData:
  users_database.yml: |
    ---
    users:
      # Usuario de ejemplo: admin
      # Password por defecto: "password" (DEBES CAMBIARLO)
      # Para generar un nuevo password hasheado, usa el script en /scripts/generate-password.sh
      admin:
        displayname: "Administrador"
        password: "$argon2id$v=19$m=65536,t=3,p=4$MlpOaUtQSE5oWW5wWmtmUw$O07iQx+8lv5n8dNzPr/B0HFpvwjqWKMz7/3kJlwRLbM"
        email: admin@TUDOMINIO.COM
        groups:
          - admins

      # Añade más usuarios aquí siguiendo el mismo formato
      # usuario2:
      #   displayname: "Usuario 2"
      #   password: "$argon2id$v=19$..."
      #   email: usuario2@TUDOMINIO.COM
      #   groups:
      #     - users
    ...
